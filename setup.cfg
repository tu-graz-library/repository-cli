[metadata]
name = repository-cli
version = attr: repository_cli.__version__
description = "CLI utilities for TU Graz Repository."
long_description = file: README.rst, CHANGES.rst
keywords = invenio repository cli
license = MIT
author = Graz University of Technology
author_email = info@inveniosoftware.org
platforms = any
url = https://github.com/inveniosoftware/repository-cli
classifiers =
    Programming Language :: Python :: 3.14
    Development Status :: 5 - Production/Stable

[options]
include_package_data = True
packages = find:
python_requires = >=3.14
zip_safe = False
install_requires =
    click>=8.0.0
    invenio-rdm-records[opensearch2]>=24.0.0
    invenio-records-marc21>=0.28.0
    invenio-records-lom>=0.20
    jq>=1.4.0
    tabulate>=0.9.0

[options.extras_require]
tests =
    pytest-invenio>=4.0.0
    pytest-black>=0.6.0
    invenio-app>=3.0.0
    invenio-search[opensearch2]>=3.0.0
    invenio-cache>=3.0.0
    Sphinx>=7.0.0
    sphinx-click>=6.0.0
    ruff>=0.5.3

[options.entry_points]
flask.commands =
    repository = repository_cli.cli:utilities
invenio_base.apps =
    repository_cli = repository_cli:RepositoryCli

[build_sphinx]
source-dir = docs/
build-dir = docs/_build
all_files = 1

[bdist_wheel]
universal = 1

[tool:isort]
profile=black

[tool:pytest]
addopts = --black --doctest-glob="*.rst" --doctest-modules --cov=repository_cli --cov-report=term-missing
testpaths = tests repository_cli
